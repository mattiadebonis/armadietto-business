<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Farmacia Rossi · Banco digitale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: assistente fisso a sinistra, area di lavoro a destra con tre tab. */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --surface-2:#F1F2EE; --lane:#EBEDE8; --chat:#F7F8F6; --line:#E2E5DF; --line-2:#C9CFC7;
  --fg:#17201B; --fg-2:#3E4943; --muted:#5B6660; --accent:#0B6B5D; --accent-ink:#FFFFFF; --accent-soft:#E3F1EE; --accent-fg:#08493F; --mint:#6FB3A5;
  --warn-bg:#FCEBDD; --warn-fg:#8F3A0C; --warn-strong:#B4470F; --info-bg:#E4EEF9; --info-fg:#174D8A; --violet-bg:#ECEAF6; --violet-fg:#4A3D8F;
  --claude:#C15F3C; --claude-soft:#F7E6DE; --ink:#17201B; --ink-fg:#FFFFFF;
  --font: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#161E1A; --surface-2:#1D2722; --lane:#131B17; --chat:#121915; --line:#2A3630; --line-2:#3A4841;
  --fg:#E7EEEA; --fg-2:#C3CEC8; --muted:#9AA8A0; --accent:#3FB39F; --accent-ink:#06231D; --accent-soft:#16332C; --accent-fg:#8ED9C9; --mint:#3F8F80;
  --warn-bg:#3A2415; --warn-fg:#F2B48C; --warn-strong:#E58A55; --info-bg:#172A42; --info-fg:#9CC2F0; --violet-bg:#262140; --violet-fg:#C2B8F5;
  --claude:#E08A66; --claude-soft:#3A241B; --ink:#E7EEEA; --ink-fg:#0F1512; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#161E1A; --surface-2:#1D2722; --lane:#131B17; --chat:#121915; --line:#2A3630; --line-2:#3A4841;
  --fg:#E7EEEA; --fg-2:#C3CEC8; --muted:#9AA8A0; --accent:#3FB39F; --accent-ink:#06231D; --accent-soft:#16332C; --accent-fg:#8ED9C9; --mint:#3F8F80;
  --warn-bg:#3A2415; --warn-fg:#F2B48C; --warn-strong:#E58A55; --info-bg:#172A42; --info-fg:#9CC2F0; --violet-bg:#262140; --violet-fg:#C2B8F5;
  --claude:#E08A66; --claude-soft:#3A241B; --ink:#E7EEEA; --ink-fg:#0F1512; color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{display:grid;grid-template-columns:minmax(320px,390px) minmax(0,1fr);min-height:100%}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}

/* ---------- Assistente ---------- */
.ai{background:var(--chat);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
@media (max-width:900px){.ai{height:auto;min-height:70vh;position:static;border-right:0;border-bottom:1px solid var(--line)}}
.ai-head{display:flex;align-items:center;gap:10px;padding:14px 12px 10px max(16px,env(safe-area-inset-left,0px))}
.ai-head h2{margin:0;font-size:16px;font-weight:600;flex:1}
.claude-tag{display:inline-flex;align-items:center;gap:5px;background:var(--claude-soft);color:var(--claude);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600}
.pend{background:var(--accent-soft);color:var(--accent-fg);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.icon-btn{border:0;background:transparent;width:34px;height:34px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn[aria-pressed="true"]{color:var(--accent)}
.ai-log{flex:1;overflow-y:auto;padding:4px 16px 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.hello{display:flex;flex-direction:column;gap:12px;padding-top:10px}
.hello h3{margin:0;font-size:24px;line-height:1.2;font-weight:600;letter-spacing:-.01em;color:var(--accent);text-wrap:balance}
.hello p{margin:0;color:var(--fg-2);font-size:15px}
.sugg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sugg button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:76px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;font-size:13px;font-weight:500}
.sugg button:hover{border-color:var(--line-2)}
.sugg small{color:var(--muted);font-weight:400;font-size:11px}
.notice{background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:10px 12px;font-size:13px}

.msg-me{align-self:flex-end;max-width:85%;background:var(--accent-soft);color:var(--fg);border-radius:18px;padding:9px 14px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-ai{display:flex;gap:10px;align-items:flex-start}
.msg-ai .star{flex:0 0 auto;margin-top:2px}
.msg-ai .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.acts{display:flex;flex-direction:column;gap:3px}
.acts:empty{display:none}
.act{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.act::before{content:"";width:6px;height:6px;border-radius:999px;background:var(--mint)}
.txt{font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.txt p{margin:0 0 6px}.txt p:last-child{margin:0}
.txt ul{margin:2px 0 6px;padding-left:18px}.txt li{margin:2px 0}
.thinking{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dots{display:inline-flex;gap:3px}.dots i{width:5px;height:5px;border-radius:999px;background:var(--accent);opacity:.4;animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}
.err{font-size:13px;color:var(--warn-fg);background:var(--warn-bg);border-radius:10px;padding:8px 10px}
.cards{display:flex;flex-direction:column;gap:10px}.cards:empty{display:none}
.prop{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.prop-k{display:flex;justify-content:space-between;gap:8px;align-items:center}
.prop-k span{font-size:12px;color:var(--muted)}
.prop-t{font-weight:600;font-size:13.5px}
.prop-q{margin:0;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13px;white-space:pre-wrap}
.prop-why{font-size:12.5px;color:var(--fg-2)}
.prop-row{display:flex;flex-wrap:wrap;gap:8px}
.prop-done{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--accent-fg);background:var(--accent-soft);border-radius:999px;padding:5px 12px;align-self:flex-start}
.prop-done.no{color:var(--muted);background:var(--surface-2)}
.fchips{display:flex;flex-wrap:wrap;gap:6px}.fchips:empty{display:none}
.fchip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;text-align:left}
.fchip:hover{border-color:var(--accent);color:var(--accent-fg)}
.fb{display:flex;gap:2px;margin-left:-6px}

.ai-foot{padding:10px 14px 14px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.ctx-chip{align-self:flex-start;font-size:12px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;color:var(--fg)}
.ctx-chip:hover{border-color:var(--accent)}
.composer{display:flex;align-items:flex-end;gap:6px;background:var(--surface);border:1px solid var(--line-2);border-radius:24px;padding:4px 4px 4px 18px}
.composer:focus-within{border-color:var(--accent)}
.composer textarea{flex:1;min-width:0;border:0;outline:none;background:transparent;resize:none;min-height:40px;max-height:140px;padding:10px 0;font-size:14px;line-height:1.4}
.send{border:0;width:40px;height:40px;border-radius:999px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.send.stop{background:var(--ink);color:var(--ink-fg)}
.fine{font-size:11px;color:var(--muted);text-align:center}

/* ---------- Area di lavoro ---------- */
.work{min-width:0;display:flex;flex-direction:column}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) 0 24px;display:flex;flex-direction:column;gap:10px}
@media (max-width:900px){.top{padding-left:max(16px,env(safe-area-inset-left,0px))}}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:0 0 auto}
.brand b{display:block;font-size:15px;font-weight:600}
.brand .grow{flex:1;min-width:160px;display:flex;flex-direction:column}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:0 13px;min-height:40px;font-size:13px;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent-fg);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:12.5px}
.btn.pill{border-radius:999px}
.btn.big{min-height:48px;font-size:15px;border-radius:10px}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:transparent;padding:0 16px;min-height:46px;font-size:15px;font-weight:600;color:var(--fg-2);border-bottom:3px solid transparent;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent-fg);border-bottom-color:var(--accent)}
.badge{background:var(--warn-strong);color:#FFFFFF;border-radius:999px;padding:0 7px;font-size:12px;line-height:19px}
.page{padding:20px max(16px,env(safe-area-inset-right,0px)) 48px 24px;display:flex;flex-direction:column;gap:18px;max-width:1480px;width:100%}
@media (max-width:900px){.page{padding-left:max(16px,env(safe-area-inset-left,0px))}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.kpi{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:1px}
.kpi:hover{border-color:var(--line-2)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.vseg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;background:var(--lane);border-radius:10px;padding:3px}
.vseg button{border:0;background:transparent;border-radius:8px;padding:0 14px;min-height:38px;font-size:13px;font-weight:600;color:var(--fg-2);white-space:nowrap}
.vseg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(23,32,27,.18)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:0 12px;min-height:34px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.summary{font-size:13px;color:var(--muted)}

.ord{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.board{flex:999 1 560px;min-width:0;overflow-x:auto}
.cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;min-width:1000px}
.dot{width:8px;height:8px;border-radius:999px;background:var(--accent);flex:0 0 auto}
.s-pagamento{background:var(--claude-soft);color:var(--claude)}
.tag.pay{background:var(--claude-soft);color:var(--claude)}
.paynote{border-radius:8px;padding:9px 11px;font-size:13px;background:var(--claude-soft);color:var(--claude)}
.col{background:var(--lane);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:420px}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:4px 6px 6px}
.col-h h3{margin:0;font-size:14px;font-weight:600}
.col-h small{display:block;font-size:12px;color:var(--muted)}
.col-h span{font-weight:600;color:var(--fg-2);font-variant-numeric:tabular-nums}
.ocard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:13px;box-shadow:0 1px 0 rgba(23,32,27,.04)}
.ocard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ocard .t{display:flex;justify-content:space-between;gap:8px;width:100%}
.ocard .t b{font-size:14px}
.ocard .t span,.ocard .sub{font-size:12px;color:var(--fg-2)}
.ocard .t span{color:var(--muted);font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{border-radius:6px;padding:2px 7px;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--fg-2)}
.tag.new{background:var(--ink);color:var(--ink-fg)}
.tag.ok{background:var(--accent-soft);color:var(--accent-fg)}
.tag.w{background:var(--warn-bg);color:var(--warn-fg)}
.tag.i{background:var(--info-bg);color:var(--info-fg)}
.col-empty{margin:0;padding:18px 8px;text-align:center;font-size:12px;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.ord > .det{flex:1 1 360px}
.split{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.split > .list{flex:1 1 320px}
.split > .det{flex:999 1 460px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.s-nuovo{background:var(--warn-bg);color:var(--warn-fg)}
.s-prep{background:var(--info-bg);color:var(--info-fg)}
.s-pronto,.s-chiuso{background:var(--accent-soft);color:var(--accent-fg)}
.s-consegna{background:var(--violet-bg);color:var(--violet-fg)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);border-left:3px solid transparent}
.row:last-child{border-bottom:0}
.row.on{border-left-color:var(--accent);background:var(--accent-soft)}
.row-main{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.row-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.row-top b{font-size:14px}
.row-sub{font-size:12.5px;color:var(--fg-2)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.det{display:flex;flex-direction:column}
.det-sec{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.det-sec:last-child{border-bottom:0}
.det h2{margin:0;font-size:19px;font-weight:600;text-wrap:balance}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lbl{font-size:12px;color:var(--muted)}
.h3{font-size:13px;font-weight:600;color:var(--fg-2)}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--surface-2);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;border-radius:6px;min-height:34px;font-size:12px;font-weight:600;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(23,32,27,.18)}
.hint{font-size:12px;color:var(--muted)}.hint.w{color:var(--warn-fg)}
.note{border-radius:8px;padding:8px 10px;font-size:12px}
.note.ok{background:var(--accent-soft);color:var(--accent-fg)}
.note.n{background:var(--surface-2);color:var(--fg-2)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:480px){.two{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;min-height:40px;background:var(--surface)}
.field input{border:0;outline:none;background:transparent;width:100%;padding:8px 6px}
.thread{display:flex;flex-direction:column;gap:4px}
.bub{max-width:85%;border-radius:10px;padding:7px 10px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--accent-soft)}
.bub.pt{align-self:flex-start;background:var(--surface-2)}
.meta{font-size:11px;color:var(--muted);margin-bottom:4px}.meta.r{align-self:flex-end}
.line-in{display:flex;gap:8px}
.line-in input,.line-in textarea{flex:1;min-width:0;border:1px solid var(--line-2);border-radius:8px;padding:9px 12px;background:var(--surface);outline:none}
.line-in textarea{resize:vertical;min-height:90px;line-height:1.45;border-radius:10px}
.line-in input:focus,.line-in textarea:focus{border-color:var(--accent)}
.ctxbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ctxbox > div{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;min-width:820px;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.toast{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--ink-fg);padding:11px max(16px,env(safe-area-inset-right,0px)) 11px 24px;font-size:13.5px;font-weight:500}
.toast.new{background:var(--accent);color:var(--accent-ink)}
.toast svg{flex:0 0 auto}
@media (max-width:900px){.toast{padding-left:max(16px,env(safe-area-inset-left,0px))}}

/* Grafica scarna del primo prototipo: barra unica in alto, tab a pillola, angoli 8px, notifiche scure. */
.top{flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px 24px}
.brand{display:contents}
.top .logo{order:0;width:40px;height:40px;font-size:15px}
.top .grow{order:1;flex:0 1 auto;min-width:0}
.top .tabs{order:2;flex:0 1 auto;gap:4px}
.top .btn{order:3;padding:0 11px}
.tab{border-bottom:0;border-radius:8px;min-height:44px;padding:0 14px;font-size:14px;font-weight:500;color:var(--fg-2)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-fg)}
.badge{background:var(--warn-strong);font-weight:600}
.toast.new{background:var(--ink);color:var(--ink-fg)}
.btn.pill{border-radius:8px}
.btn.big{border-radius:10px}
.ai{background:var(--surface)}
.ai-head{border-bottom:1px solid var(--line);padding-bottom:12px}
.ai-log{background:var(--chat);padding-top:16px}
.hello h3{font-size:20px;color:var(--fg)}
.hello p{font-size:14px}

function rules() {
  return `Sei l'assistente della Farmacia Rossi, dentro la dashboard web del farmacista. Oggi è venerdì 27 novembre 2026, sono le ${now()}. Parli con la Dott.ssa Bianchi, farmacista titolare.
Il pannello «In arrivo» della dashboard raccoglie i messaggi in arrivo da WhatsApp, app e link e notifiche di pagamento, già letti e smistati in bozze d'ordine, consulti o domande pratiche; la farmacista decide lì. Se ci sono messaggi da gestire, ricordali all'inizio della risposta in una riga, prima il più urgente, e poi rispondi alla domanda. La dashboard ha due sezioni: Ordini (ricette con NRE arrivate da WhatsApp, link web o app; ritiro in farmacia o consegna con il fattorino Luca nel giro delle 16:00) e Telefarmacia (consulti dei pazienti per messaggio, a cui risponde il farmacista). Con leggi_pazienti vedi anche le terapie che i pazienti condividono dall'app Armadietto, con i giorni di scorta rimasti, ma non c'è una schermata dedicata.

Regole:
- Flusso degli ordini: la farmacista verifica ricetta, disponibilità e totale; poi la dashboard manda al paziente un link di pagamento (carta, Apple Pay, Google Pay); l'ordine si prepara solo quando il pagamento è confermato. Per chi non ha ancora pagato puoi proporre un promemoria (avanza_ordine su un ordine in attesa di pagamento invia il promemoria). Non puoi segnare un pagamento come ricevuto.
- Consegne: di base le porta il fattorino della farmacia (Luca, giro 16-18, la farmacista affida il giro). In alternativa un rider partner tipo Glovo, prenotato dalla vista Giro di consegna, con costo per consegna e tracking per il paziente. I farmaci da frigo e gli stupefacenti vanno sempre con il fattorino. Puoi consigliare come dividerle, ma la prenotazione la fa la farmacista.
- Leggi i dati con gli strumenti prima di rispondere. Non inventare pazienti, ordini, orari o numeri.
- Non dai consigli clinici: niente dosi, dimenticanze, interazioni, effetti indesiderati, sostituzioni. Se la domanda è clinica dillo in una frase e indica il consulto o l'ordine dove deve rispondere il farmacista.
- Per fare qualcosa usa proponi_azione: compare una scheda e la farmacista approva o scarta. Non dire mai che un'azione è fatta: dì che l'hai proposta.
- I messaggi per i pazienti sono brevi, cortesi, in italiano, senza indicazioni cliniche, e finiscono con "Farmacia Rossi".
- Sii proattiva. Quando nei dati c'è qualcosa da fare (ricette da verificare, disponibilità da indicare, ordini pronti da affidare al fattorino o da segnare ritirati, pazienti da avvisare, terapie condivise in esaurimento, consulti che aspettano), proponilo con proponi_azione anche se non te l'ha chiesto: una scheda per azione, al massimo 3 per risposta, prima le più urgenti. Nel testo non ripetere ciò che c'è già nelle schede.
- Alla fine di ogni risposta chiama suggerisci_seguiti con 2 o 3 domande brevi che la farmacista potrebbe farti dopo.
- Puoi portare la farmacista alla schermata giusta con apri_schermata.
- Rispondi in italiano, breve e concreto. Testo semplice: frasi brevi, elenchi con il trattino quando servono, **grassetto** solo per nomi e codici. Niente tabelle né titoli.`;
}

  return open().map((o) => ({ codice: o.code, paziente: o.patient, chi_ordina: o.who || undefined, canale: CH[o.ch], ricevuto: o.at, stato: ST[o.status], modalita: o.mode, quando: o.slot, indirizzo: o.address || undefined,
    farmaci: o.items.map((i) => ({ nome: i.name, disponibilita: i.av ? AV.find((a) => a[0] === i.av)[1] : 'da indicare', frigo: i.fridge || undefined })),
    senza_ricetta: o.free || undefined, importo: o.amount || undefined, consegna_con: o.mode === 'consegna' ? (o.via === 'rider' ? 'rider partner' + (o.rider ? ' (' + o.rider.state + ')' : ', da prenotare') : 'fattorino della farmacia') : undefined, pagamento: o.paidAt ? 'pagato alle ' + o.paidAt : o.status === 'pagamento' ? 'link inviato alle ' + o.linkAt + ', non ancora pagato' : o.noPay ? 'nulla da pagare' : 'totale da indicare in verifica', foto_promemoria: o.photo || undefined, riordino_da_armadietto: o.armadietto || undefined }));
}

    messaggi: c.msgs.map((m) => (m.me ? 'Farmacia: ' : 'Paziente: ') + m.t), terapie_condivise: c.shared, ordini: c.orders }));

function proposal(inp) {
  const id = 'p' + (++propSeq); const tipo = String(inp.tipo || '');
  const o = inp.codice_ordine ? byCode(inp.codice_ordine) : null;
  let kind = '', title = '', body = null;
  if (tipo === 'avanza_ordine') { kind = 'Ordine'; title = o ? nextActionText(o) + ' · #' + o.code + ' ' + o.patient : 'Ordine ' + (inp.codice_ordine || '') + ' non trovato'; }
  else if (tipo === 'segna_disponibilita') { kind = 'Disponibilità'; title = (inp.farmaco || 'Farmaco') + ': ' + ({ pronto: 'pronto', grossista: 'dal grossista', equivalente: 'equivalente' }[inp.disponibilita] || inp.disponibilita) + (o ? ' · #' + o.code : ''); }
  else if (tipo === 'messaggio_paziente') { kind = 'Messaggio'; title = 'Messaggio per ' + (inp.paziente || 'il paziente'); body = h('p', { class: 'prop-q' }, String(inp.testo || '')); }
  else { kind = 'Proposta'; title = tipo; }
  const actions = h('div', { class: 'prop-row' });
  const card = h('div', { class: 'prop', id }, h('div', { class: 'prop-k' }, h('span', { class: 'tag ok' }, kind), h('span', null, 'Proposta da Claude')), h('div', { class: 'prop-t' }, title), body, inp.motivo ? h('div', { class: 'prop-why' }, String(inp.motivo)) : null, actions);
  const finish = (ok, text) => { actions.replaceWith(h('div', { class: 'prop-done' + (ok ? '' : ' no') }, text)); pendingNotes.push((ok ? 'La farmacista ha approvato: ' : 'La farmacista ha scartato: ') + title); };
  actions.append(
    h('button', { class: 'btn pri sm pill', type: 'button', on: { click: () => { const r = applyProposal(tipo, inp, o); if (r) finish(true, r); } } }, tipo === 'messaggio_paziente' ? 'Approva e invia' : 'Approva'),
    h('button', { class: 'btn sm pill', type: 'button', on: { click: () => finish(false, 'Scartata') } }, 'Scarta'));
  props[id] = inp; return card;
}
function nextActionText(o) { return o.status === 'nuovo' ? 'Conferma e invia il link di pagamento' : o.status === 'pagamento' ? 'Promemoria di pagamento' : o.status === 'prep' ? 'Segna pronto' : o.status === 'pronto' ? (o.mode === 'consegna' ? 'Affida al fattorino' : 'Segna ritirato') : 'Conferma la consegna'; }
function applyProposal(tipo, inp, o) {
  if (tipo === 'avanza_ordine') { if (!o || o.status === 'chiuso') { toast('Ordine non trovato o già chiuso.'); return null; } const before = ST[o.status]; if (!advance(o)) return null; return 'Fatto: da ' + before.toLowerCase() + ' a ' + ST[o.status].toLowerCase(); }
  if (tipo === 'segna_disponibilita') {
    if (!o) { toast('Ordine non trovato.'); return null; }
    const f = String(inp.farmaco || '').toLowerCase().split(/[ ,]/)[0];
    const it = o.items.find((i) => i.name.toLowerCase().includes(f));
    if (!it || !['pronto', 'grossista', 'equivalente'].includes(inp.disponibilita)) { toast('Farmaco non trovato nell’ordine.'); return null; }
    it.av = inp.disponibilita; S.tab = 'ordini'; S.sel = o.id; render(); return 'Disponibilità aggiornata';
  }
  if (tipo === 'messaggio_paziente') {
    const name = String(inp.paziente || '').toLowerCase(); const t = String(inp.testo || '').trim();
    if (!t) return null;
    const ord = open().find((x) => x.patient.toLowerCase() === name || (x.who || '').toLowerCase().includes(name));
    const con = S.consults.find((x) => x.status !== 'chiuso' && x.patient.toLowerCase() === name);
    if (con) { con.msgs.push({ me: true, t, at: now() }); con.status = 'attesa'; }
    else if (ord) ord.chat.push({ me: true, t, at: now() });
    render(); toast('Messaggio inviato a ' + (inp.paziente || 'paziente') + ' con il nome Farmacia Rossi');
    return 'Inviato';
  }
  return null;
}

/* ---- rendering del testo di Claude (markdown minimo, sempre come testo) ---- */
function inline(el, s) { s.split(/(\*\*[^*]+\*\*)/g).forEach((p) => { if (/^\*\*[^*]+\*\*$/.test(p)) el.append(h('strong', null, p.slice(2, -2))); else if (p) el.append(document.createTextNode(p)); }); return el; }
function richText(text) {
  const box = h('div', { class: 'txt' }); let ul = null;
  for (const raw of String(text).split('\n')) {
    const line = raw.trimEnd();
    const li = line.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)$/);
    if (li) { if (!ul) { ul = h('ul'); box.append(ul); } ul.append(inline(h('li'), li[1])); continue; }
    ul = null; if (line.trim()) box.append(inline(h('p'), line.replace(/^#+\s*/, '')));
  }
  return box;
}

  const up = mk('Risposta utile', '', 'up'); up.append(svg('<path d="M7 10v12"></path><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"></path>'));

const ERR = {
  not_granted: 'Non hai consentito a questa pagina di usare Claude.', sampling_disabled: 'Claude non è disponibile per questo account.',
  rate_limited: 'Troppe richieste in poco tempo. Riprova tra un momento.', session_expired: 'La sessione è scaduta: accedi di nuovo a Claude.',
  refused: 'Claude non ha risposto a questa richiesta. Prova a riformularla.', empty_completion: 'Claude non ha scritto niente. Prova a chiedere in modo più semplice.',
  prompt_too_large: 'La conversazione è troppo lunga: inizia una nuova conversazione.', upstream_error: 'Si è interrotta la connessione con Claude. Riprova.'
};

async function askClaude(text) {
  if (document.querySelector('.app').classList.contains('noai')) setAi(true);
  text = String(text || '').trim();
  if (!text || busy) return;
  if (!sample) { toast(sampleState === 'loading' ? 'Sto collegando Claude, riprova tra un attimo.' : 'Claude non è disponibile in questa vista.'); return; }
  const log = $('log');
  if (log.querySelector('.hello')) log.replaceChildren();
  log.append(h('div', { class: 'msg-me' }, text));
  const actBox = h('div', { class: 'acts' });
  const thinking = h('div', { class: 'thinking' }, h('span', { class: 'dots' }, h('i'), h('i'), h('i')), 'Claude sta pensando…');
  const textBox = h('div');
  const cardBox = h('div', { class: 'cards' });
  const followBox = h('div', { class: 'fchips' });
  const body = h('div', { class: 'body' }, actBox, thinking, textBox, cardBox, followBox);
  log.append(h('div', { class: 'msg-ai' }, h('svg', { class: 'star', width: '20', height: '20', viewBox: '0 0 24 24', 'aria-hidden': 'true' }), body));
  const star = log.lastChild.querySelector('svg'); star.innerHTML = '<path d="M12 2c.6 4.8 3.2 7.4 8 8-4.8.6-7.4 3.2-8 8-.6-4.8-3.2-7.4-8-8 4.8-.6 7.4-3.2 8-8z" fill="var(--accent)"></path>';
  scrollLog();

  let content = text;
  if (S.tab === 'ordini' && S.sel) { const o = open().find((x) => x.id === S.sel); if (o) content += '\n\n[Schermata aperta: Ordini, ordine #' + o.code + ' di ' + o.patient + ']'; }
  else if (S.tab === 'tele' && S.cSel) { const c = S.consults.find((x) => x.id === S.cSel); if (c) content += '\n\n[Schermata aperta: Telefarmacia, consulto ' + c.id + ' di ' + c.patient + ']'; }
  else if (S.tab === 'inbox' && S.iSel) { const it = S.inbox.find((x) => x.id === S.iSel); if (it) content += '\n\n[Schermata aperta: Inbox, messaggio ' + it.id + ' di ' + it.from + ']'; }
  else if (S.tab === 'pazienti' && S.pSel) { const p = S.patients.find((x) => x.id === S.pSel); if (p) content += '\n\n[Schermata aperta: Pazienti, ' + p.name + ']'; }
  { const pend = S.inbox.filter((x) => !x.done); if (pend.length) content += '\n\n[In arrivo, da gestire: ' + pend.map((x) => x.from + ' (' + (x.state === 'reading' ? 'in lettura' : x.kind) + ', ' + CH[x.ch] + ' ' + x.at + ')').join('; ') + ']'; }
  if (pendingNotes.length) { content = '[Nel frattempo: ' + pendingNotes.join('; ') + ']\n\n' + content; pendingNotes = []; }
  if (!toolsOk) content += '\n\n[Dati della farmacia, in sola lettura]\nOrdini: ' + JSON.stringify(snapshotOrders()) + '\nConsulti: ' + JSON.stringify(snapshotConsults()) + '\nPazienti: ' + JSON.stringify(snapshotPatients()) + '\n(In questa vista non puoi proporre azioni: descrivi cosa faresti.)';
  turns.push({ role: 'user', content });
  while (JSON.stringify(turns).length > 40000 && turns.length > 2) turns.splice(0, 2);

  const ctl = new AbortController(); busy = ctl; setSend();
  try {
    const opts = { signal: ctl.signal, cache: false, onText: ({ text: t }) => { thinking.remove(); textBox.replaceChildren(richText(t)); scrollLog(); } };
    if (toolsOk) { delete opts.cache; opts.tools = tools(actBox, cardBox, followBox); }
    const res = await sample([{ role: 'user', content: rules() }, ...turns], opts);
    thinking.remove(); textBox.replaceChildren(richText(res.text));
    if (res.truncated) body.append(h('div', { class: 'hint' }, 'Risposta interrotta perché troppo lunga: chiedi una cosa alla volta.'));
    turns.push({ role: 'assistant', content: res.text });
    body.append(fbRow(res.text));
  } catch (e) {
    thinking.remove();
    if (e && e.text) textBox.replaceChildren(richText(e.text)); else if (e && e.code === 'refused') textBox.replaceChildren();
    if (e && e.code !== 'cancelled') body.append(h('div', { class: 'err' }, ERR[e && e.code] || ERR.upstream_error));
    if (e && e.code === 'not_granted') sampleState = 'denied';
    if (e && e.text) turns.push({ role: 'assistant', content: e.text });
  } finally { busy = null; setSend(); scrollLog(); }
}

function setSend() {
  const b = $('sendBtn');
  if (busy) { b.classList.add('stop'); b.setAttribute('aria-label', 'Ferma'); b.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"></rect></svg>'; }
  else { b.classList.remove('stop'); b.setAttribute('aria-label', 'Invia'); b.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path></svg>'; }
}
function updateCtxChip() {

try { if (localStorage.getItem('farmacia-ai-nascosto') === '1') { document.querySelector('.app').classList.add('noai'); $('aiOpen').setAttribute('aria-pressed', 'false'); } } catch (e) { /* storage non disponibile */ }
function simMenu(open) { $('simMenu').hidden = !open; $('simBtn').setAttribute('aria-expanded', String(open)); }
$('simBtn').addEventListener('click', (e) => { e.stopPropagation(); simMenu($('simMenu').hidden); });
$('simMenu').addEventListener('click', () => simMenu(false));
document.addEventListener('click', (e) => { if (!e.target.closest('.sim')) simMenu(false); });
document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if (!$('simMenu').hidden) { simMenu(false); $('simBtn').focus(); } else if (S.tab === 'ordini' && S.sel) { S.sel = null; render(); } });
$('simPay').addEventListener('click', () => {
  const o = open().find((x) => x.status === 'pagamento');
  if (!o) { toast('Nessun ordine in attesa di pagamento: conferma prima un ordine con un totale.'); return; }
  markPaid(o);
});
$('inBtn').addEventListener('click', () => setIn(document.querySelector('.app').classList.contains('noin')));
try { if (localStorage.getItem('farmacia-in-nascosto') === '1') { document.querySelector('.app').classList.add('noin'); $('inBtn').setAttribute('aria-pressed', 'false'); } } catch (e) { /* storage non disponibile */ }
$('newChat').addEventListener('click', () => { if (busy) busy.abort(); turns.length = 0; pendingNotes = []; renderHello(); });
$('simOrder').addEventListener('click', () => {
  const p = POOL[S.next % POOL.length]; S.next++;
  const o = { fresh: true, id: 'n' + S.next, code: String(2049 + S.next), patient: p.patient, who: '', ch: p.ch, at: now(), status: 'nuovo', mode: p.mode, slot: p.slot, address: p.address, cf: p.cf, amount: '', free: '',
    items: [ { name: p.item[0], nre: p.item[1], av: null } ], chat: p.msg ? [ { me: false, t: p.msg, at: now() } ] : [] };
  S.orders.unshift(o); S.tab = 'ordini'; S.sel = o.id; render(); toast('Nuovo ordine da ' + p.patient + ' su ' + CH[p.ch], 'new');
});

seedInbox(); S.iSel = null;
render(); renderHello();
(async () => {
  try {
    const s = window.claude && window.claude.use ? await window.claude.use('sample') : null;
    if (!s) { sampleState = 'off'; renderHello(); return; }
    sample = s; sampleState = 'ready';
    try { const lim = await s.limits(); toolsOk = !!(lim && lim.tools); } catch (e) { toolsOk = false; }
  } catch (e) { sampleState = 'off'; renderHello(); }
})();
})();
</script>

</body>
</html>
